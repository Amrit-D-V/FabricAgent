<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Terminal Window Background with Drop Shadow -->
  <rect x="20" y="20" width="820" height="480" rx="12" fill="url(#bg-grad)" stroke="#1f2937" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Header Bar -->
  <path d="M 20 32 A 12 12 0 0 1 32 20 L 828 20 A 12 12 0 0 1 840 32 L 840 56 L 20 56 Z" fill="#161e2e"/>
  <line x1="20" y1="56" x2="840" y2="56" stroke="#1f2937" stroke-width="1"/>

  <!-- Mac Window Buttons -->
  <circle cx="44" cy="38" r="6" fill="#ef4444"/>
  <circle cx="64" cy="38" r="6" fill="#f59e0b"/>
  <circle cx="84" cy="38" r="6" fill="#10b981"/>

  <!-- Window Title -->
  <text x="430" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle" font-weight="500">
    fabricagent tui — FabricAgent Terminal Assistant v0.2.0
  </text>

  <!-- Terminal Content (Monospace) -->
  <g font-family="'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="13" line-height="1.5">
    <!-- Launch Command -->
    <text x="44" y="86" fill="#10b981" font-weight="600">$</text>
    <text x="60" y="86" fill="#f3f4f6">fabricagent tui</text>

    <!-- Welcome Banner Panel -->
    <rect x="44" y="104" width="772" height="66" rx="6" fill="#111827" stroke="#0ea5e9" stroke-width="1"/>
    <text x="60" y="128" fill="#38bdf8" font-weight="700">FabricAgent Terminal Assistant</text>
    <text x="310" y="128" fill="#9ca3af" font-size="12">v0.2.0 (Open Source)</text>
    <text x="60" y="152" fill="#9ca3af" font-size="12">Engine: <tspan fill="#38bdf8" font-weight="600">Gemini / Ollama</tspan> • Mode: <tspan fill="#ec4899" font-weight="600">dashboard</tspan> • Fabric Cloud: <tspan fill="#10b981" font-weight="600">Mock AdventureWorks</tspan></text>

    <!-- User Prompt -->
    <text x="44" y="200" fill="#38bdf8" font-weight="700">fabricagent&gt;</text>
    <text x="160" y="200" fill="#f9fafb">Write a safe YoY Sales Growth % measure for FactInternetSales</text>

    <!-- Thinking indicator -->
    <text x="44" y="228" fill="#6b7280" font-size="11">── Brain 1 (Planner) &amp; Brain 2 (Compiler BPA Gate) ─────────────────────────────</text>

    <!-- DAX Output -->
    <text x="44" y="258" fill="#fbbf24" font-weight="700">[YoY Sales Growth %]</text>
    <text x="210" y="258" fill="#9ca3af">=</text>

    <text x="60" y="282" fill="#c084fc" font-weight="700">VAR</text>
    <text x="95" y="282" fill="#e5e7eb">_CurrentYearSales =</text>
    <text x="260" y="282" fill="#38bdf8">[Total Sales]</text>

    <text x="60" y="306" fill="#c084fc" font-weight="700">VAR</text>
    <text x="95" y="306" fill="#e5e7eb">_PriorYearSales =</text>
    <text x="240" y="306" fill="#60a5fa" font-weight="600">CALCULATE</text>
    <text x="315" y="306" fill="#e5e7eb">(</text>
    <text x="330" y="306" fill="#38bdf8">[Total Sales]</text>
    <text x="425" y="306" fill="#e5e7eb">,</text>
    <text x="440" y="306" fill="#60a5fa">SAMEPERIODLASTYEAR</text>
    <text x="585" y="306" fill="#e5e7eb">(</text>
    <text x="595" y="306" fill="#34d399">'DimDate'[FullDateAlternateKey]</text>
    <text x="830" y="306" fill="#e5e7eb">)</text>

    <text x="60" y="330" fill="#c084fc" font-weight="700">RETURN</text>

    <text x="80" y="354" fill="#60a5fa" font-weight="600">DIVIDE</text>
    <text x="130" y="354" fill="#e5e7eb">(</text>
    <text x="145" y="354" fill="#e5e7eb">_CurrentYearSales - _PriorYearSales,</text>
    <text x="440" y="354" fill="#e5e7eb">_PriorYearSales,</text>
    <text x="575" y="354" fill="#f43f5e" font-weight="600">0</text>
    <text x="590" y="354" fill="#e5e7eb">)</text>

    <!-- Validation & Guardrail Badge in Output -->
    <rect x="44" y="380" width="772" height="74" rx="6" fill="#161e2e" stroke="#1f2937" stroke-width="1"/>
    <text x="60" y="404" fill="#10b981" font-weight="700">✓ BPA Rules Passed:</text>
    <text x="225" y="404" fill="#9ca3af">Enforced DIVIDE() • Avoided division-by-zero • Safe date hierarchy</text>
    <text x="60" y="426" fill="#38bdf8" font-weight="700">✓ TMDL Doctor:</text>
    <text x="180" y="426" fill="#9ca3af">Formatted DAX with standard indentations • Ready for PBIP/TMDL export</text>
    <text x="60" y="444" fill="#6b7280" font-size="11">Tokens: 142 • Time: 0.74s • Cost: $0.00 (Gemini Free Tier)</text>

    <!-- Next user prompt with blinking cursor -->
    <text x="44" y="482" fill="#38bdf8" font-weight="700">fabricagent&gt;</text>
    <rect x="156" y="470" width="8" height="15" fill="#38bdf8"/>
  </g>
</svg>
