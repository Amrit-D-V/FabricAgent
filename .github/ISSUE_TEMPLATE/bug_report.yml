name: 🐛 Bug Report
description: Report a bug or unexpected behavior in FabricAgent
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command / Action
      description: What command or API endpoint did you execute?
      placeholder: "e.g. fabricagent tui, fabricagent validate ..."
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. Enter '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, Python version, LLM provider.
      value: |
        - OS: [e.g. Ubuntu 24.04, macOS 14, Windows 11]
        - Python Version: [e.g. 3.11, 3.12, 3.14]
        - AI Provider: [e.g. Gemini, Ollama, OpenAI]
    validations:
      required: true
