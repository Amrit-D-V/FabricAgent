[flake8]
# Project style standard. PEP 8 with a modern line length.
max-line-length = 100
max-complexity = 15
# E203/W503 conflict with PEP 8's own recommendation and Black; widely disabled.
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    venv,
    lib,
    build,
    dist,
    node_modules,
    FabricBI_beta
# Patterns are fnmatched against the path as flake8 reports it, which is
# relative to the invocation root. A bare `dir/file.py` is what matches; a
# leading `*/` makes the entry match NOTHING and silently gates nothing.
per-file-ignores =
    # `dataset` is injected at runtime by the Power BI Python-visual host.
    presentations/pbi_python_visual_discount_waterfall.py: F821, E402
    #
    # ---------------------------------------------------------------------
    # FROZEN DEBT BASELINE
    #
    # flake8 was pinned but never wired to anything, so the first CI run
    # found 633 violations across 74 files: 517 E501, 58 E402, 54 C901,
    # 2 F401, 1 W293, 1 F541. Every one of them predates the gate.
    #
    # This list is a ratchet, not an amnesty. It names each file and the
    # exact codes already failing in it, so:
    #   - a file not on this list is fully gated,
    #   - a NEW class of violation in a listed file still fails the build,
    #   - deleting an entry is the unit of paying the debt down.
    # Nothing here is a global ignore and max-complexity still applies
    # everywhere it is not explicitly suspended below.
    #
    # The one that matters most: llm/pbi_tool_exec.py suspends C901 for
    # _execute_pbi_tool_impl, a ~1900-line dispatch function measuring 345.
    # That is the god-function refactor, tracked separately -- not a claim
    # that 345 is acceptable.
    # ---------------------------------------------------------------------
    auth/auth.py: E501
    cli/fabric_cli.py: E501
    cli/main.py: E501
    cli/setup_wizard.py: C901, E501
    cli/tui.py: C901, E501
    db/database.py: C901, E501
